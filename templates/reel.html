<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>gummietech — Drop reel</title>
<style>
{% include 'slides.css' %}

/* ============================================================
   The Drop reel — 1080x1920 (9:16). The same five slides as the
   carousel, from the same partial, swiped through one at a time.
   Rendered frame by frame by src/reel.py, which reads the reel's
   length off these animations: the template owns how long the
   reel is, as it owns how many slides a post has.

   Instagram draws over a reel: the account name across the top
   ~200px, caption, audio and buttons across the bottom ~400px.
   So the slides sit in a card scaled to 0.9 (972x1215) from
   y=300 to y=1515, and the preprint flag above it at y≈215.
   reel.py checks both against SAFE_TOP / SAFE_BOTTOM on every
   scene rather than trusting these numbers.
   ============================================================ */

:root { --scene: 3.5s; --enter: 0.45s; }

body { background: var(--ink); }

.stage {
  position: relative; overflow: hidden;
  width: 1080px; height: 1920px;
}

/* One backdrop per slide, fading in with its scene, so the whole
   9:16 frame takes the slide's field. They carry `slide` and the
   field class only to resolve --field the way a slide does — the
   rhythm is render.py's, and repeating its hue mapping here would
   be a second place for it to drift. */
.stage > .backdrop.slide {
  position: absolute; inset: 0;
  width: auto; height: auto; padding: 0;
  animation: fade-in var(--enter) ease-out both;
}

/* No card on screen (2026-09-30, the owner's call): the content floats on
   the full-screen moving backdrop, still scaled to 0.9 inside the safe
   zone. So a slide has no background, grid or grain of its own, and the
   scenes cross-fade instead of swiping: a swipe would lay one scene's
   words over the last's. The glass ghost words are painted onto the
   backdrop (slides_layout.js). */
.card {
  position: absolute; left: 54px; top: 300px;
  width: 1080px; height: 1350px;
  transform: scale(0.9); transform-origin: 0 0;
}
.stage .card .slide { background: transparent; }
.stage .card .slide::before, .stage .card .slide::after { display: none; }
.card > .slide {
  position: absolute; top: 0; left: 0;
  /* in, then out just before the next scene, so the two sets of words are
     never on screen at once (a cross-fade layered them at half strength);
     `forwards` on the way out so it cannot hold a slide visible early */
  animation: fade-in var(--enter) ease-out both, fade-out calc(var(--enter) * .6) ease-in forwards;
  animation-delay: var(--t), calc(var(--t) + var(--scene) - var(--enter) * .6);
}

/* When each scene starts. Slide 1 is on screen from the first frame. */
.stage > .backdrop.slide:nth-of-type(1) { --t: 0s; animation: none; }
/* on from frame 0 (a zero-length fade-in keeps reel.py's scene start at 0) */
.card > .slide:nth-child(1) { --t: 0s; animation-duration: 0s, calc(var(--enter) * .6); }
.stage > .backdrop.slide:nth-of-type(2), .card > .slide:nth-child(2) { --t: calc(var(--scene) * 1); }
.stage > .backdrop.slide:nth-of-type(3), .card > .slide:nth-child(3) { --t: calc(var(--scene) * 2); }
.stage > .backdrop.slide:nth-of-type(4), .card > .slide:nth-child(4) { --t: calc(var(--scene) * 3); }
.stage > .backdrop.slide:nth-of-type(5), .card > .slide:nth-child(5) { --t: calc(var(--scene) * 4); }
.stage > .backdrop.slide { animation-delay: var(--t); }

/* The words rise in just after their slide lands. */
.card > .slide :is(.sec, .text, .diff .minus, .follow, .tagline, .sources) {
  animation: rise 0.5s ease-out both;
  animation-delay: calc(var(--t) + 0.3s);
}

/* The keyword callouts assemble in order, one callout after another: the
   tag rises, its wire draws out from the tag and then down to the rule,
   and the dot lands. --i is the callout's index (slides_layout.js). */
.card > .slide .cloud :is(.tag, .wire, .dot) {
  --at: calc(var(--t) + 0.35s + var(--i) * 0.35s);
}
.card > .slide .cloud .tag    { animation: rise 0.4s ease-out both; animation-delay: var(--at); }
.card > .slide .cloud .wire.h { animation: strike 0.3s cubic-bezier(.6, 0, .2, 1) both; animation-delay: calc(var(--at) + 0.3s); }
.card > .slide .cloud .wire.v { transform-origin: top; animation: grow 0.35s cubic-bezier(.6, 0, .2, 1) both; animation-delay: calc(var(--at) + 0.55s); }
.card > .slide .cloud .dot    { animation: pop 0.22s ease-out both; animation-delay: calc(var(--at) + 0.85s); }

/* The selection box draws itself around its phrase, left to right, then
   its handles pop — the carousel's static box, performed. Real elements
   (.box, .h), because a ::before animation computes but does not paint
   when reel.py seeks frame by frame. */
.card > .slide .sel .box {
  animation: draw 0.5s cubic-bezier(.6, 0, .2, 1) both;
  animation-delay: calc(var(--t) + 0.7s);
}
.card > .slide .sel .h {
  animation: pop 0.22s ease-out both;
  animation-delay: calc(var(--t) + 1.15s);
}

/* The catch plays as a diff: the claim, struck through, then the
   correction. The honesty moment is the one that moves most. */
.card > .slide .diff .minus .strike {
  animation: strike 0.45s cubic-bezier(.6, 0, .2, 1) both;
  animation-delay: calc(var(--t) + 1.0s);
}
.card > .slide .diff .plus {
  animation: rise 0.5s ease-out both;
  animation-delay: calc(var(--t) + 1.55s);
}

/* The loop: the cover fades back in after the last scene, and the reel
   ends the moment it lands, so its last frame is its first and Instagram's
   replay has no seam. It is a clone of slide 1 made in the page (see the
   script below), so it cannot say anything the cover does not; it is not a
   `.card > .slide`, so reel.py still counts five scenes. Its box stays
   undrawn, as it is on frame 0. */
.card > .loop {
  position: absolute; inset: 0;
  animation: fade-in var(--enter) ease-out both;
  animation-delay: calc(var(--scene) * 5);
}
.card > .loop > .slide { position: absolute; top: 0; left: 0; }
.card > .loop .sel :is(.box, .h) { visibility: hidden; }
.stage > .backdrop.slide:nth-of-type(6) { --t: calc(var(--scene) * 5); }
/* Except the hook's: a reel autoplays from its first frame, and a viewer
   deciding whether to stop scrolling must see the hook on it, not an
   empty card. The cover's whole face is there from frame 0 — the hook is
   not animated on it, and its spec row and figure never were. */

/* Not decoration: the one animation that spans the whole reel, so its end
   is the reel's length — five scenes, then the cover's return, ending on
   the frame it lands. The extra 0.05s is one frame at 30fps: reel.py's
   last frame falls up to a frame before the end, and without it the cover
   was 17ms short of landing, so the loop visibly jumped. */
.clock {
  position: absolute; width: 1px; height: 1px; opacity: 0;
  animation: hold calc(var(--scene) * 5 + var(--enter) + 0.05s) linear both;
}

/* The preprint flag for the whole reel, not just the catch scene: in a
   video a label that is on screen for three seconds is not a label.
   Deliberately never animated — reel.py fails the render if any frame
   shows it less than fully. It wears the carousel's catch-flag colours
   (lead hue, ink type); the ink border keeps its edge visible on the two
   lead-field scenes, where the stage is the same hue as the pill. */
.reel-flag {
  position: absolute; top: 215px; left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  background: var(--lead); color: var(--ink);
  border: 4px solid var(--ink);
  font-family: var(--mono); font-weight: 600; font-size: 30px;
  padding: 10px 26px; border-radius: 6px;
}
/* So the catch slide's own flag, which the carousel needs, is a second copy
   here: on 2026-10-02 the catch scene showed the label twice, 100px apart.
   Only the reel's is checked frame by frame, so it is the one kept. */
.card .flag-row { display: none; }

@keyframes fade-in  { from { opacity: 0; } to { opacity: 1; } }
@keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }
@keyframes rise     { from { opacity: 0; transform: translateY(28px); }
                      to   { opacity: 1; transform: none; } }
@keyframes hold     { from { opacity: 0; } to { opacity: 0; } }
@keyframes draw     { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes pop      { from { transform: scale(0); } to { transform: scale(1); } }
@keyframes strike   { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes grow     { from { transform: scaleY(0); } to { transform: scaleY(1); } }
</style>
</head>
<body style="--lead: var(--{{ lead }})">
<div class="stage">
  {% set scenes = rhythm(5) %}
  {% for field in scenes %}<div class="backdrop slide {{ field }}"></div>{% endfor %}
  <div class="backdrop slide {{ scenes[0] }}"></div>
  <div class="card">
{% include 'drop_slides.html' %}
    <div class="loop" aria-hidden="true"></div>
  </div>
  {% if show_preprint_flag %}<div class="reel-flag">Preprint — not yet peer-reviewed</div>{% endif %}
  <div class="clock"></div>
</div>
<script>
/* The loop's cover: slide 1, cloned before the layout pass runs so it is
   fitted exactly as the original is. */
(function () {
  var cover = document.querySelector('.card > .slide').cloneNode(true);
  cover.removeAttribute('id');
  document.querySelector('.card > .loop').appendChild(cover);
}());
{% include 'slides_layout.js' %}
</script>
</body>
</html>
