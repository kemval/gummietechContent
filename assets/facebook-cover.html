<!doctype html>
<!--
  The Facebook page cover. Substack's banner layout (assets/substack-banner.html)
  at Facebook's ratio, 1200x456, exported to 1640x624. Chosen by the owner on
  2026-10-19: signal's backdrop (pink field, olive ribbons) as a still, seed
  "facebook", and Substack's three parts as ruled rows over the ribbons instead
  of solid blocks, with repair as the third. Phones crop the sides and the
  profile photo covers the bottom centre; the owner took that over a layout
  squeezed into the phone-safe area.

  To re-export, from the repo root:
    venv/bin/python -c "from playwright.sync_api import sync_playwright as s; \
    import pathlib; p = s().start(); b = p.chromium.launch(); \
    g = b.new_page(viewport={'width': 1200, 'height': 456}, device_scale_factor=1640/1200); \
    g.goto(pathlib.Path('assets/facebook-cover.html').resolve().as_uri()); \
    g.wait_for_timeout(1000); g.screenshot(path='assets/facebook-cover.png'); b.close(); p.stop()"
-->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../templates/tokens.css">
<style>
@font-face { font-family: 'Hubot Sans'; src: url('../fonts/HubotSans.ttf'); font-weight: 200 900; font-stretch: 75% 125%; }
@font-face { font-family: 'Mona Sans'; src: url('../fonts/MonaSans.ttf'); font-weight: 200 900; font-stretch: 75% 125%; }
@font-face { font-family: 'Monaspace Neon'; src: url('../fonts/MonaspaceNeon-SemiBold.otf'); font-weight: 600; }
* { margin: 0; box-sizing: border-box; }
/* Substack's banner (1200x400) at Facebook's ratio: 1200x456, exported to 1640x624. */
body { width: 1200px; height: 456px; overflow: hidden; }
.banner { position: relative; width: 1200px; height: 456px; display: grid; grid-template-columns: 1fr 360px; color: var(--ink); font-family: var(--body); background: var(--pink); }
.banner > canvas.bg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
.mono { font-family: var(--mono); font-weight: 600; font-size: 17px; letter-spacing: .06em; text-transform: uppercase; }
.lead { position: relative; z-index: 1; padding: 56px 60px; display: flex; flex-direction: column; justify-content: space-between; }
.word { font-family: var(--display); font-weight: 800; font-stretch: 110%; letter-spacing: -.02em; line-height: .9; font-size: 104px; }
.tag { font-size: 23px; line-height: 1.3; font-weight: 500; max-width: 640px; }
.tag b { font-weight: 700; }
.parts { position: relative; z-index: 1; display: grid; grid-template-rows: 1fr 1fr 1fr; border-left: 2px solid var(--ink); }
.parts div { display: flex; align-items: center; padding: 0 30px; white-space: nowrap; font-family: var(--display); font-weight: 700; font-size: 28px; }
.parts div + div { border-top: 2px solid var(--ink); }
.parts .mono { font-size: 14px; margin-right: 18px; opacity: .7; }
</style></head><body>
<div class="banner">
  <div class="lead">
    <div class="mono">@gummietech · noticias de tecnología</div>
    <div class="word">GummieTech</div>
    <p class="tag">La tecnología de la semana, sin hype y con fuentes. También reparamos computadoras, celulares e impresoras.</p>
  </div>
  <div class="parts">
    <div><span class="mono">01</span>Qué pasó</div>
    <div><span class="mono">02</span>Por qué importa</div>
    <div><span class="mono">03</span>Reparación</div>
  </div>
</div>
<script src="../templates/backdrop.js"></script>
<script>
// The slides' own shader, drawn once at frame 0. Without WebGL the field stays flat pink.
if (window.Ribbons) Ribbons.attach(document.querySelector('.banner'),
  { field: 'pink', palette: ['pink', 'olive'], seed: 'facebook' });
</script>
</body></html>
