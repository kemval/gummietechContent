# Tier 1 — primary sources (where news is born)
#
# Re-verify after editing:  python src/verify_feeds.py -v
# Re-run monthly. Publishers move these without notice.
#
# --- considered, not wired in ---
#
# The big tech-news sites are the obvious next feeds to add and all five of
# these were measured on 2026-09-22 and rejected. Ars Technica and MIT
# Technology Review are already below; the rest fail for structural reasons,
# so a future session does not need to re-probe them.
#
# The cost is not that ingest.py's prefilter drops them — it is that they
# mostly survive it. Together they are 45–100 items/day onto a sheet taking
# ~247, and near enough all of it would be rejected by score.py, spending
# the free tier's daily request cap that CLAUDE.md names as the one budget
# in this pipeline that actually binds.
#
#   Techmeme        <item><link> is techmeme.com/260922/p36, its own cluster
#                   permalink rather than the article. ingest's URL dedupe
#                   therefore cannot match it against the Ars or Verge copy
#                   of the same story, and draft.resolve_paper would fetch a
#                   cluster page, which has no citation_doi and no abstract.
#                   Sampled headlines were user-growth numbers, a UN speech
#                   and a legal-AI startup: 0 of 8 science.
#   TechCrunch      20/day. is_noise caught 3 of 20; the rest was Disrupt
#                   conference promotion and funding coverage, which reaches
#                   the LLM and scores at or below 3 on every axis.
#   The Verge       is_noise caught 0 of 10. Xbox layoffs, headphones,
#                   politics — consumer tech, so nothing in DROP_PATTERNS
#                   fits and all of it would be scored.
#   Pragmatic       Substack, and paywalled: <description> ran 144–200 chars
#   Engineer        across the newest three items, the truncation docs §3
#                   Tier 5 warns about. draft.py would work from a 150-char
#                   stub. The beat is software careers, not science.
#   TLDR            tldr.tech/api/rss/tech is live, but one item is one
#                   issue — title "Googlebooks, Grok 4.7, Google infiltrates
#                   hackers", <description> empty, link to the digest page.
#                   One item is not one story. See feeds/tier5_depth.yaml.
#   Anthropic       anthropic.com/news advertises no feed and the usual
#                   /rss.xml paths 404 (2026-10-07, again 2026-10-09). Wired
#                   in below through a third-party mirror instead, as are
#                   xAI and Cohere, which have no feed either. Perplexity
#                   (/hub, same mirror) was left out: SEO listicles.
#   Meta AI         ai.meta.com/blog advertises no feed; /rss/ and /feed/
#                   return HTTP 400 (2026-10-07). The Olshansk mirror's
#                   feed_meta_ai.xml was 75 days stale on 2026-10-09, and
#                   about.fb.com/news is corporate PR, not model launches.
#                   Its launches reach the sheet through Hacker News 200+.

feeds:

  # --- research institutions ---
  - name: MIT News
    url: https://news.mit.edu/rss/feed
    topic: general

  # NASA Breaking News retired: /rss/dyn/breaking_news.rss 301s to
  # /news-release/feed/, which is the NASA News Releases entry below.
  # Listed first, it claimed the items and mislabelled their source.

  # JPL's own feed is gone; NASA now hosts center feeds on nasa.gov
  - name: NASA JPL
    url: https://www.nasa.gov/centers-and-facilities/jpl/feed/
    topic: space

  - name: NASA News Releases
    url: https://www.nasa.gov/news-release/feed/
    topic: space

  - name: NASA Technology
    url: https://www.nasa.gov/technology/feed/
    topic: tech

  - name: ESA Space News
    url: https://www.esa.int/rssfeed/Our_Activities/Space_News
    topic: space

  - name: ESA Space Science
    url: https://www.esa.int/rssfeed/Our_Activities/Space_Science
    topic: space

  - name: Berkeley Lab
    url: https://newscenter.lbl.gov/feed/
    topic: general

  - name: Berkeley News
    url: https://news.berkeley.edu/feed/
    topic: general

  # /about/news/feed is 403; /news/rss redirects to the live one
  - name: Caltech
    url: https://www.caltech.edu/news/rss
    topic: general

  # Oak Ridge retired: /rss.xml is Drupal's promoted-nodes feed — section
  # landing pages with node-edit timestamps, not articles. Every /news feed
  # path 404s and ORNL's own RSS directory page is a 404. No replacement
  # short of a third-party bridge (EurekAlert/Newswise).

  - name: EPFL
    url: https://actu.epfl.ch/feeds/rss/mediacom/en/
    topic: engineering

  # was mpg.de/rss/all (404) — English research feed
  - name: Max Planck Society
    url: https://www.mpg.de/en/research.rss
    topic: general

  # --- company newsrooms ---
  #
  # `announces` lists the URL prefixes where each company publishes its own
  # announcements, measured from the sheet's rows on 2026-10-07 — never
  # from memory. A page under one of them with no paper behind it is the
  # maker's own announcement, decided by code (draft.maker_announcement):
  # the cover says "Announcement — not a peer-reviewed study", a Signal may
  # carry it, and a later story that links to one already posted is a
  # duplicate. A company blog that describes a paper still resolves the
  # paper, and the paper wins. Hugging Face's blog also hosts other
  # organisations' posts (huggingface.co/blog/ibm-research/…): each is still
  # its author's own announcement. See docs/decisions/voice-and-selection.md.
  - name: Google DeepMind
    url: https://deepmind.google/blog/rss.xml
    topic: ai
    announces: [deepmind.google/blog/]

  - name: Google Research
    url: https://research.google/blog/rss/
    topic: ai
    announces: [research.google/blog/]

  - name: OpenAI
    url: https://openai.com/news/rss.xml
    topic: ai
    announces: [openai.com/index/]

  # Added 2026-10-07 with score.py's relevance axis: model launches are what
  # the AI digests lead with, and a lab's own announcement is the source
  # fact-check can verify against. Mixes launches with partnerships and a
  # funding round; score.py drops the second two.
  - name: Mistral AI
    url: https://mistral.ai/news/rss
    topic: ai
    announces: [mistral.ai/news/]

  - name: Microsoft Research
    url: https://www.microsoft.com/en-us/research/feed/
    topic: ai
    announces: [microsoft.com/en-us/research/blog/]

  - name: Hugging Face Blog
    url: https://huggingface.co/blog/feed.xml
    topic: ai
    announces: [huggingface.co/blog/]

  - name: NVIDIA Developer Blog
    url: https://developer.nvidia.com/blog/feed/
    topic: ai
    announces: [developer.nvidia.com/blog/]

  - name: NVIDIA Newsroom
    url: https://nvidianews.nvidia.com/releases.xml
    topic: tech
    announces: [nvidianews.nvidia.com/news/, blogs.nvidia.com/blog/]

  - name: Waymo
    url: https://waymo.com/blog/rss.xml
    topic: robotics
    announces: [waymo.com/blog/]

  - name: Cloudflare Blog
    url: https://blog.cloudflare.com/rss/
    topic: tech
    announces: [blog.cloudflare.com/]

  - name: Apple Newsroom
    url: https://www.apple.com/newsroom/rss-feed.rss
    topic: tech
    announces: [apple.com/newsroom/]

  # Added 2026-10-09 to cover the launches the AI digests lead with. The
  # `announces` prefixes below come from each feed's own item links, not
  # the sheet — re-measure them from the sheet after the first ingest.
  - name: AWS Machine Learning Blog
    url: https://aws.amazon.com/blogs/machine-learning/feed/
    topic: ai
    announces: [aws.amazon.com/blogs/machine-learning/]

  - name: GitHub Blog AI & ML
    url: https://github.blog/ai-and-ml/feed/
    topic: ai
    announces: [github.blog/ai-and-ml/]

  # The Copilot label only; the full changelog is mostly minor UI changes.
  # github.blog/news-insights/product-news/feed/ was 129 days stale.
  - name: GitHub Changelog Copilot
    url: https://github.blog/changelog/label/copilot/feed/
    topic: ai
    announces: [github.blog/changelog/]

  # THIRD-PARTY. These three labs publish no feed (see the block at the top
  # of this file). github.com/Olshansk/rss-feeds (MIT) scrapes their news
  # pages hourly with GitHub Actions. Item links point at the maker's own
  # page, so `announces` still works; the summary is only the title, so
  # score.py judges from very little. The first fetch carries hundreds of
  # backlog entries, hence `max_items`. If the scraper breaks the feed goes
  # stale silently — verify_feeds.py and watch.py's 60-day check are the
  # only alarm.
  - name: Anthropic
    url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_news.xml
    topic: ai
    announces: [anthropic.com/news/]
    max_items: 10

  - name: xAI
    url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_xainews.xml
    topic: ai
    announces: [x.ai/news/]
    max_items: 10

  - name: Cohere
    url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_cohere.xml
    topic: ai
    announces: [cohere.com/blog/]
    max_items: 10

  # --- journals / science press ---
  - name: Nature News
    url: https://www.nature.com/nature.rss
    topic: general

  - name: Nature Astronomy
    url: https://www.nature.com/natastron.rss
    topic: space

  - name: Nature Materials
    url: https://www.nature.com/nmat.rss
    topic: materials

  # Feed is truncated to its most recent items — ~8 entries, not a fault.
  # Research articles are paywalled, so draft.py will often work from the
  # summary. That is the case fact-check exists to catch.
  - name: Nature Physics
    url: https://www.nature.com/nphys.rss
    topic: physics

  - name: Science News (AAAS)
    url: https://www.science.org/rss/news_current.xml
    topic: general

  - name: PNAS
    url: https://www.pnas.org/rss/current.xml
    topic: general

  - name: Cell Press
    url: https://www.cell.com/cell/current.rss
    topic: biology

  - name: PLOS Biology
    url: https://journals.plos.org/plosbiology/feed/atom
    topic: biology

  - name: Quanta Magazine
    url: https://api.quantamagazine.org/feed/
    topic: general

  - name: Science News magazine
    url: https://www.sciencenews.org/feed
    topic: general

  - name: Scientific American
    url: http://rss.sciam.com/ScientificAmerican-Global
    topic: general

  - name: Physics World
    url: https://physicsworld.com/feed/
    topic: physics

  - name: Science Daily - Top Tech
    url: https://www.sciencedaily.com/rss/top/technology.xml
    topic: tech

  - name: IEEE Spectrum
    url: https://spectrum.ieee.org/feeds/feed.rss
    topic: engineering

  # Trade press, so some items are deals and financing. DROP_PATTERNS catches
  # "acquires" but not "to acquire" — expect a few business items at scoring.
  - name: The Robot Report
    url: https://www.therobotreport.com/feed/
    topic: robotics

  - name: InfoQ AI/ML/Data
    url: https://feed.infoq.com/ai-ml-data-eng/
    topic: ai

  - name: MIT Technology Review
    url: https://www.technologyreview.com/feed/
    topic: tech

  - name: Ars Technica
    url: https://feeds.arstechnica.com/arstechnica/index
    topic: tech

  # Added 2026-10-09: an AI news desk, one story per item, ~10 items and
  # ~900-char summaries. Unlike TechCrunch and The Verge (rejected above),
  # it is AI-only, so little of it is spent on scoring off-topic items.
  - name: The Decoder
    url: https://the-decoder.com/feed/
    topic: ai

  # Above the general Phys.org feed on purpose. ingest.py dedupes first-wins
  # in file order, and 4 of these 30 items also appear there — this ordering
  # is what tags them `space` instead of `general`.
  - name: Phys.org Space
    url: https://phys.org/rss-feed/space-news/
    topic: space

  - name: Phys.org
    url: https://phys.org/rss-feed/
    topic: general

  # Science X's engineering/computing newsroom — same publisher as Phys.org,
  # measured zero URL overlap with it (different host).
  - name: Tech Xplore
    url: https://techxplore.com/rss-feed/
    topic: tech

  # Space.com retired 2026-09-23: its RSS is broken on the publisher's side,
  # not moved. /feeds/all now 301s to /feeds.xml, which is a valid 899-byte
  # RSS document with a current lastBuildDate, zero items, and the title
  # "Latest from null" — a section slug resolving to nothing in Future PLC's
  # CMS. /rss and /feeds/rss serve that same byte-identical stub, /feeds/news
  # serves another one, and /feeds/all.xml, /feeds/news.xml and section paths
  # 404. The homepage's own <link rel="alternate"> points at the broken file,
  # so there is nothing to correct the URL to.
  #
  # The control says it is space.com and not the platform or our User-Agent:
  # livescience.com/feeds.xml and techradar.com/feeds.xml, same publisher and
  # same path convention, both serve 50 items to the same request.
  #
  # Left out rather than left empty because it verified OK-but-empty on every
  # sweep, and a permanent "1 empty" in a checker's summary is how a person
  # learns to skim past its output. Space is the best-covered topic in this
  # file anyway — Phys.org Space, Universe Today, NASASpaceflight, AAS Nova,
  # two ESA feeds and three NASA ones. Restore the entry if Future ever fixes
  # the slug; re-probe https://www.space.com/feeds.xml and look for <item>.


  # ~5/day, but 5 of 20 titles duplicate Phys.org Space under different URLs,
  # so ingest's URL dedupe will not catch them. Net new is closer to 4/day.
  - name: Universe Today
    url: https://www.universetoday.com/rss.xml
    topic: space

  - name: NASASpaceflight
    url: https://www.nasaspaceflight.com/feed/
    topic: space

  # One peer-reviewed AAS paper per post, first author named — the best
  # depth-per-item here. Serves ~600 entries / 4.2 MB on every fetch, by far
  # the heaviest feed in this file. Drop it if ingest runtime becomes a problem.
  - name: AAS Nova
    url: https://aasnova.org/feed/
    topic: space

  - name: New Atlas
    url: https://newatlas.com/index.rss
    topic: engineering

  - name: Hackaday
    url: https://hackaday.com/blog/feed/
    topic: engineering

  # --- physics ---
  # home.cern/api/news/news/feed.rss 404s; home.cern/feed is the live one.
  - name: CERN
    url: https://home.cern/feed
    topic: physics

  - name: CERN Courier
    url: https://cerncourier.com/feed/
    topic: physics

  - name: Fermilab News
    url: https://news.fnal.gov/feed/
    topic: physics
