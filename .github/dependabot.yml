# Proposes dependency bumps as pull requests. Free on every repository.
#
# requirements.txt and every `uses:` are pinned, so nothing moves on its own;
# this is how they still move. Each PR runs check.yml, which renders and
# proofs the fixture — the test a Playwright bump actually needs — and the
# rule in CLAUDE.md holds: merge only on a green check.yml.
#
# Weekly and grouped, so a week of releases is one PR per ecosystem, not a
# dozen notifications for a project with one maintainer.
version: 2
updates:
  # Reads requirements.in and regenerates requirements.txt with pip-compile.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  # Actions are pinned to a commit with the version in a comment; Dependabot
  # updates both. A new major version (v5 → v6) comes as its own PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
