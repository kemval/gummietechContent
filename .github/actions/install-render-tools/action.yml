name: Install the render tools
description: >
  Chromium for Playwright, ffmpeg and poppler when asked, without the Ubuntu
  mirror on a normal day. apt is only the fallback, bounded and retried.

# One definition, four callers — check.yml, review.yml, reel.yml and site.yml.
# The same reasoning that put the alert in notify-failure: a copy per
# workflow is four places to forget the next time the mirror misbehaves.
#
# 2026-10-08: watch.yml's run of check.yml was cancelled at its 15-minute
# limit with "Install Chromium" still running. `--with-deps` installs
# Chromium's libraries through apt, and the Azure Ubuntu mirror went from
# milliseconds a package to seconds, then sat eight minutes on one 10.8 MB
# package. Nothing timed out but the job, so the alert said master was
# broken when the mirror was slow. The install normally takes 0.4 minutes.
#
# So each attempt gets ATTEMPT_MINUTES and there is one retry: a stalled
# connection is the failure, and a fresh one is usually the cure. apt also
# retries a download itself and gives up on a silent connection after 30s
# — that config file outlives this step, so a later apt-get in the same job
# gets it too. A retry after a kill first lets dpkg finish what it was
# doing, or the second attempt would wait on its lock.
#
# 2026-10-23: that retry never ran. Attempt 1 timed out on a crawling
# mirror, and attempt 2 failed in two seconds on the dpkg lock, held by
# attempt 1's apt-get. `--with-deps` runs apt through sudo, as root, and a
# timeout running as the runner user may not signal a root process: the
# kill was refused and apt went on. So the apt half (Chromium's libraries,
# ffmpeg) runs under a timeout that is itself root, and only the browser
# download, which belongs in the runner's own cache, runs as the user.
#
# 2026-11-11: the retry ran, and timed out the same way, four times over
# two hours. apt leaves a mirror only when a download stops dead (no data
# for 30s); Azure's node was trickling, not stopped, so both attempts sat on
# it (actions/runner-images#14823, open). The runner reads its mirrors from
# /etc/apt/apt-mirrors.txt, Azure first; attempt 2 now deletes that line and
# downloads from archive.ubuntu.com instead. Attempt 1 keeps Azure, which is
# the fast one on a normal day.
#
# 2026-11-18: the retry did not change mirror, twice. Runners now list an
# AWS node first (us-east-2.ec2.archive.ubuntu.com), it trickled at tens of
# kB/s, and the fallback only knew the Azure hostname, so it matched nothing
# and attempt 2 sat on the same node. The retry now writes the list as
# archive.ubuntu.com alone, whichever regional node the runner names.
#
# Worst case is two full attempts, about ten minutes: every caller's
# timeout-minutes leaves room for that on top of its normal run.

#
# 2026-11-08: weekly.yml's incident writer fetched the SEC's Knight Capital
# order (a PDF) and could not read it: the Read tool turns a PDF into pages
# through poppler's pdftoppm, which the runner image does not ship. It
# rightly wrote nothing, and the Sunday post did not go out. So poppler is
# an option here too — for the writer, with no Chromium, and for review.yml's
# fact-check, which checks the same source.
#
# 2026-11-18: off the mirror. Every note above is a patch on the same
# dependency, and the upstream issues (actions/runner-images#14823, #15040)
# are still open, with archive.ubuntu.com itself reported silent for 15+
# minutes. So the normal path no longer downloads from any Ubuntu mirror:
#   - Chromium is Playwright's own build, from Playwright's CDN. Its system
#     libraries are already on the image, which ships Google Chrome; a
#     launch proves it. Only a failed launch runs install-deps through apt.
#   - ffmpeg is the static BtbN build inside the imageio-ffmpeg wheel, from
#     PyPI, pinned in requirements.txt. Only a missing libx264 falls back.
#   - poppler's .debs are kept in actions/cache, keyed on the runner image
#     version, and installed with dpkg. A miss (about once a week, when the
#     image moves) fetches them through apt and saves them.
# The apt path below is the same bounded, mirror-swapping retry as before.

inputs:
  chromium:
    description: Install Chromium for Playwright. 'false' for a job that only needs the tools below.
    default: 'true'
  ffmpeg:
    description: Also put ffmpeg on the PATH (reel.py, and render.py's motion clips).
    default: 'false'
  poppler:
    description: Also install poppler-utils, so Claude's Read tool can read a PDF source.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Key the poppler cache
      id: key
      if: inputs.poppler == 'true'
      shell: bash
      # ImageVersion is set by the runner itself. A new image may need other
      # .debs (or none), so it is a new cache. Keyed on the release
      # (20261111), not the build: two jobs of one run were handed
      # 20261111.127.1 and 20261111.370.1, and missed each other's cache. A
      # .deb that no longer fits fails dpkg, and apt takes over.
      run: |
        echo "debs=$RUNNER_TEMP/render-tools-debs" >> "$GITHUB_OUTPUT"
        version="${ImageVersion:-unknown}"
        echo "key=render-tools-poppler-${ImageOS:-unknown}-${version%%.*}" >> "$GITHUB_OUTPUT"

    - name: Restore poppler's packages
      id: restore
      if: inputs.poppler == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.key.outputs.debs }}
        key: ${{ steps.key.outputs.key }}

    - name: Install${{ inputs.chromium == 'true' && ' Chromium' || '' }}${{ inputs.ffmpeg == 'true' && ' ffmpeg' || '' }}${{ inputs.poppler == 'true' && ' poppler' || '' }}
      id: install
      shell: bash
      env:
        APT_MINUTES: '4'
        BROWSER_MINUTES: '1'
        CHROMIUM: ${{ inputs.chromium }}
        FFMPEG: ${{ inputs.ffmpeg }}
        POPPLER: ${{ inputs.poppler }}
        DEBS: ${{ steps.key.outputs.debs }}
      run: |
        printf '%s\n' 'Acquire::Retries "3";' \
          'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' |
          sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null

        # What still has to come through apt, if anything.
        apt_half=""
        packages=""
        poppler_apt=false

        if [ "$CHROMIUM" = "true" ]; then
          # Playwright's CDN, not the mirror; the runner user's cache.
          fetched=false
          for attempt in 1 2; do
            if timeout --kill-after=30s "${BROWSER_MINUTES}m" python -m playwright install chromium; then
              fetched=true
              break
            fi
            echo "::warning::Chromium download attempt $attempt failed or ran past ${BROWSER_MINUTES} minute(s)."
          done
          if [ "$fetched" != "true" ]; then
            echo "::error::Playwright's Chromium did not download in two attempts. Its CDN, not the Ubuntu mirror: re-run this workflow later from the Actions tab."
            exit 1
          fi
          # A launch is the proof that the image has its libraries.
          if timeout 60s python -c 'from playwright.sync_api import sync_playwright as s; p = s().start(); p.chromium.launch().close(); p.stop()'; then
            echo "Chromium launches with the image's own libraries."
          else
            echo "::warning::Chromium did not launch on the image's libraries; installing them through apt."
            apt_half="$(command -v python) -m playwright install-deps chromium"
          fi
        fi

        if [ "$FFMPEG" = "true" ]; then
          # Captured, not piped into grep -q: under pipefail an early grep
          # exit makes ffmpeg's SIGPIPE read as a missing encoder.
          exe="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())' 2>/dev/null || true)"
          encoders=""
          [ -n "$exe" ] && encoders="$("$exe" -hide_banner -encoders 2>/dev/null || true)"
          if [[ "$encoders" == *libx264* ]]; then
            bin="$RUNNER_TEMP/render-tools-bin"
            mkdir -p "$bin"
            ln -sf "$exe" "$bin/ffmpeg"
            echo "$bin" >> "$GITHUB_PATH"
            echo "ffmpeg from the imageio-ffmpeg wheel: $("$exe" -version | head -n1)"
          else
            echo "::warning::imageio-ffmpeg gave no ffmpeg with libx264 (is it in requirements.txt and installed?); installing ffmpeg through apt."
            packages="$packages ffmpeg"
          fi
        fi

        if [ "$POPPLER" = "true" ]; then
          if compgen -G "$DEBS/*.deb" >/dev/null &&
             sudo timeout 2m dpkg -i "$DEBS"/*.deb >/dev/null &&
             command -v pdftoppm >/dev/null; then
            echo "poppler from the cache: $(pdftoppm -v 2>&1 | head -n1)"
          else
            echo "No usable poppler cache for this image; installing it through apt and saving the packages."
            sudo dpkg --configure -a || true
            rm -rf "$DEBS"
            mkdir -p "$DEBS/partial"
            poppler_apt=true
          fi
        fi

        if [ -z "$apt_half" ] && [ -z "$packages" ] && [ "$poppler_apt" != "true" ]; then
          echo "Nothing came from an Ubuntu mirror."
          exit 0
        fi

        # Run as root, values baked in: sudo resets PATH and the environment.
        # install-deps refreshes the package lists itself; without it, do so.
        [ -n "$apt_half" ] || apt_half="apt-get update"
        if [ -n "$packages" ]; then
          apt_half="$apt_half && apt-get install -y --no-install-recommends$packages"
        fi
        # Its own install, so only poppler's .debs land in the cached folder.
        if [ "$poppler_apt" = "true" ]; then
          apt_half="$apt_half && apt-get install -y --no-install-recommends -o Dir::Cache::archives=$DEBS poppler-utils"
        fi

        for attempt in 1 2; do
          if [ "$attempt" -gt 1 ]; then
            sudo dpkg --configure -a || true
            # The retry goes to a different mirror, or it waits on the same
            # slow node again: see the 2026-11-11 and 2026-11-18 notes above.
            # Whatever regional node the runner lists, the retry uses only
            # archive.ubuntu.com.
            mirrors=/etc/apt/apt-mirrors.txt
            if [ -f "$mirrors" ] &&
               grep -v '^http://archive\.ubuntu\.com/ubuntu/\?$' "$mirrors" | grep -q .; then
              echo "Retrying on archive.ubuntu.com instead of: $(tr '\n' ' ' < "$mirrors")"
              echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee "$mirrors" >/dev/null
            fi
          fi
          # The timeout is root, so it can signal apt and dpkg: see the
          # 2026-10-23 note above. It kills the group if a TERM is ignored.
          if sudo timeout --kill-after=30s "${APT_MINUTES}m" bash -c "$apt_half"; then
            if [ "$poppler_apt" = "true" ] && compgen -G "$DEBS/*.deb" >/dev/null; then
              sudo chown -R "$(id -un)" "$DEBS"
              rm -rf "$DEBS/partial" "$DEBS/lock"
              echo "save=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          echo "::warning::Install attempt $attempt failed or ran past its ${APT_MINUTES} minutes — the Ubuntu mirror is the usual cause."
        done
        echo "::error::The apt fallback did not finish in two attempts. The mirror is probably down or crawling: re-run this workflow later from the Actions tab."
        exit 1

    # Saved straight away, not in a post step, so a job that fails later
    # (a held post, say) still keeps the packages for the next run.
    - name: Save poppler's packages
      if: steps.install.outputs.save == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.key.outputs.debs }}
        key: ${{ steps.key.outputs.key }}
