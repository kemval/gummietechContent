name: Resolve the post
description: >
  The post a phone-dispatched workflow should act on: the one it was given,
  or the one the gate last spoke about. Outputs `post` (a path) and `stem`.

# One definition, two callers — recheck.yml and fix.yml, which are the two
# ways back from a held post and must never disagree about which post is
# held. The same reasoning that put the gate in review.yml and the alert in
# notify-failure.
#
# Typing a 52-character filename on a phone is not a workflow, so a blank
# input means "the post that is waiting".
#
# What "waiting" means changed on 2026-09-19. It used to mean the newest
# dated post with no published_at, which worked because normal running left
# exactly one. Then the cadence decision — The Drop 3x/week, drafted ahead
# and buffered from the evergreen queue — made several undated posts the
# normal state rather than the broken one. Under that, the newest is the
# wrong answer: a buffered draft written after a post was held would steal
# both ways back from the post the person is actually looking at, and the
# "more than one waiting" warning would fire on every dispatch until it
# meant nothing.
#
# So the question is no longer "which draft is newest" but "which post is the
# person looking at", and the chat answers it: review.yml uploads a
# reports-<stem> artifact for every post it sends, so the newest surviving
# one names the post the gate last spoke about. That is the post whose
# message carries the buttons. fix.yml already reads these artifacts to get
# the report itself; this reads only their names.

inputs:
  post:
    description: A post path, or blank to pick the one awaiting approval.
    required: false
    default: ''
  token:
    description: >
      A token with `actions: read`, used to ask which post the gate last
      reported on. Omit it and the pick falls back to the newest undated
      draft, which is right only while there is one.
    required: false
    default: ''

outputs:
  post:
    description: Path to the post JSON, relative to the repo root.
    value: ${{ steps.pick.outputs.post }}
  stem:
    description: >
      Its filename without .json — names artifacts and rides in the Telegram
      button's callback_data. A stem has no character an artifact name
      rejects; the full path would, because of the slash.
    value: ${{ steps.pick.outputs.stem }}

runs:
  using: composite
  steps:
    - id: pick
      shell: bash
      env:
        POST: ${{ inputs.post }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        # Stems the gate has reported on, newest first, one per line. Any
        # failure here — no token, no `actions: read`, GitHub down — leaves
        # this blank and the pick falls back, because a missing hint must
        # never be worse than not having asked. per_page=100 is not a
        # window that can miss the current gate: the endpoint returns the
        # newest artifacts first, and the run in question is minutes old.
        GATE_STEMS=""
        if [ -n "$GH_TOKEN" ]; then
          GATE_STEMS=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '[.artifacts[]
                   | select(.expired | not)
                   | select(.name | startswith("reports-"))]
                  | sort_by(.created_at) | reverse | .[].name' \
            2>/dev/null | sed 's/^reports-//') || GATE_STEMS=""
        fi
        export GATE_STEMS

        python3 <<'PY'
        import json
        import os
        import pathlib
        import re
        import sys

        asked = os.environ.get("POST", "").strip()

        def emit(path: pathlib.Path | str) -> None:
            # Appended, never written whole: GITHUB_OUTPUT is shared with
            # every other step of the composite and of its caller.
            path = pathlib.Path(path)
            with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                fh.write(f"post={path}\nstem={path.stem}\n")

        if asked:
            if not pathlib.Path(asked).is_file():
                sys.exit(f"::error::{asked} is not on master. Check the path, "
                         f"or leave the input blank to pick the post awaiting "
                         f"approval.")
            emit(asked)
            print(f"Acting on the post given: {asked}")
            raise SystemExit(0)

        # Every draft.py post is named YYYY-MM-DD-<slug>.json, so the date
        # prefix sorts chronologically. The filter is not decoration:
        # posts/era.json is the hand-built fixture from the first commit, has
        # neither a prefix nor a published_at, and sorts after every real
        # draft — unfiltered it would be picked every single time.
        dated = re.compile(r"\d{4}-\d{2}-\d{2}-")
        waiting = []
        for path in sorted(pathlib.Path("posts").glob("*.json")):
            if not dated.match(path.name):
                continue
            try:
                post = json.loads(path.read_text())
            except (OSError, json.JSONDecodeError) as exc:
                # site.py skips a malformed draft rather than dying on it, and
                # one bad file must not block acting on a good one.
                print(f"::warning::skipping {path}: {exc}")
                continue
            if not post.get("published_at"):
                waiting.append(path)

        if not waiting:
            sys.exit("::error::No post is awaiting approval — every dated "
                     "draft in posts/ already has published_at.")

        # The gate's own answer, when it has one: the newest reported stem
        # that is still undated. A stem whose post has since been published
        # is skipped rather than ending the search — the buttons on an older
        # message stay meaningful for as long as that post is unresolved.
        by_stem = {p.stem: p for p in waiting}
        for stem in os.environ.get("GATE_STEMS", "").split():
            if stem in by_stem:
                emit(by_stem[stem])
                print(f"Acting on the post the gate last reported on: "
                      f"{by_stem[stem]}")
                if len(waiting) > 1:
                    rest = ", ".join(str(p) for p in waiting
                                     if p is not by_stem[stem])
                    print(f"{len(waiting) - 1} other draft(s) undated, which "
                          f"is the buffer, not a fault: {rest}")
                raise SystemExit(0)

        if len(waiting) > 1:
            # No usable hint, so this is the old heuristic and the old
            # warning: picking the newest can bury an older held post.
            others = ", ".join(str(p) for p in waiting[:-1])
            print(f"::warning::{len(waiting)} posts are awaiting approval and "
                  f"no surviving report says which one the gate last sent. "
                  f"Taking the newest; still waiting: {others}")

        emit(waiting[-1])
        print(f"Acting on the newest post awaiting approval: {waiting[-1]}")
        PY
