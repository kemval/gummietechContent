name: site

# Builds the web archive (posts/*.json → GitHub Pages) and deploys it.
# The Instagram bio points here: it is the only place a reader can click
# through to the source a carousel was built from, because Instagram does
# not make caption URLs clickable.
#
# No secrets — site.py reads the repo and nothing else. Only posts that
# carry a published_at date are built, so an unapproved draft sitting in
# posts/ cannot reach the web. Layer 5 stays a human gate.

on:
  push:
    branches: [master]
    paths:
      - 'posts/**'
      - 'templates/**'
      - 'fonts/**'
      - 'src/site.py'
      - 'src/render.py'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy that is already publishing; just queue behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # Pinned — ubuntu-latest becomes 26.04 over Oct–Nov 2026. See docs/decisions/runner-pin.md.
    runs-on: ubuntu-24.04
    # About 2 minutes measured on 2026-10-08, plus ten for
    # install-render-tools' second attempt.
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # site.py renders each post's first slide as its link-preview image,
      # through render.py's own page. This used to be skipped as minutes of
      # download for nothing; it now buys the preview a pasted link shows in
      # a DM, which is how this archive is mostly reached. Without it the
      # build still succeeds — site.py warns and ships text-only previews.
      - uses: ./.github/actions/install-render-tools

      - name: Build the site
        run: python src/site.py

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # A single job, so one failure step covers the build and the deploy.
      # This one is the quietest failure in the repo: the archive just stops
      # updating, and every link in the bio keeps working, on yesterday's
      # posts.
      - name: Say so in Telegram if this run broke
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
