name: daily

# Layers 3 through 4b, once a day: draft the top-scoring story, translate it,
# commit it, then hand the rest to review.yml — fact-check, render, proof, and
# a Telegram message for approval.
#
# It stops there. The post JSON is committed without `published_at`, so
# site.py skips it and nothing reaches the web archive or Instagram until a
# person taps the button in Telegram — publish.yml is what picks that up.
#
# The review half is a reusable workflow because recheck.yml calls it too, on
# a post whose first review broke. The gate that withholds the button lives
# there, once.

on:
  schedule:
    # Monday, Wednesday, Friday — the three Drops §1 fixes the cadence at.
    # It ran every day until 2026-09-19, against a three-a-week pillar, and
    # the four surplus drafts a week were not free: each one spends a Gemini
    # draft call, a translate call, a review.yml run whose fact-check draws on
    # the same Claude quota as an interactive session, a render, and a message
    # in the approval chat. Nothing decided how deep the buffer of undated
    # drafts should get, so it grew by four a week for as long as it ran.
    #
    # Drafting on the days the Drop goes out keeps the buffer at roughly one
    # post, which is what resolve-post's fallback is right for. The other
    # three pillars need no cron: The Build is video and never touches src/,
    # and the Breakdown and the Signal are drafted by hand and dispatched.
    #
    # Four times, and all four before the hour the message is wanted, because
    # this cron is not delivered when it is asked for. Every firing this
    # workflow has ever had was hours late:
    #
    #   asked 12:17 UTC → ran 17:04, 17:04, 16:29, 15:55, 18:12
    #                     (2026-09-16 … 09-21: +3h38m to +5h55m)
    #
    # Not queueing delay — `created_at` equals `run_started_at` on all five,
    # so it is the scheduler itself firing late. The 2026-09-21 run took
    # 5h55m and landed at 12:15 in America/Costa_Rica, against a comment
    # here promising 06:30, which is what made the day look like a failure
    # when nothing had failed. Note the shape: 5/5 delivered, none dropped.
    # Lateness is this workflow's failure mode, not shedding — unlike
    # publish.yml and ingest.yml, whose high-frequency crons are shed
    # instead (see CLAUDE.md).
    #
    # You cannot ask for less delay, only earlier. So ask four times, two
    # hours apart, ending at the old 12:17: whichever firing GitHub honours
    # first drafts the post, and the `gate` job below makes the rest no-ops.
    # Worst case is exactly the behaviour above; best case the 06:17 firing
    # is honoured promptly and the message is waiting before the day starts.
    # A message that arrives early sits in the chat; one that arrives at
    # midday has already missed the morning.
    #
    # 06:17 UTC = 00:17 in America/Costa_Rica, which does not observe DST, so
    # none of these drift across the year. The offset minute is deliberate:
    # the top of the hour is the most contended slot on GitHub's scheduler.
    - cron: '17 6,8,10,12 * * 1,3,5'
  workflow_dispatch:
    inputs:
      force:
        description: >
          Draft even though posts/ already has a post dated today. Leave it
          off unless you mean it — see the `gate` job.
        type: boolean
        required: false
        default: false

# Two drafts in flight would race on the sheet row and on the push.
concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write         # claude-code-action's default GitHub App auth

jobs:
  # The four crons above are one request repeated, not four posts wanted, so
  # every firing after the one GitHub honours first has to do nothing. The
  # question it asks is "has today already been drafted?", answered off the
  # filename: draft.py writes posts/<date.today()>-<slug>.json, so a post
  # carrying today's date is proof that a sibling firing already did the work.
  # It reads the date with the same call draft.py makes, on the same runner,
  # so the two cannot disagree about when today starts.
  #
  # A bare workflow_dispatch is held to this too, and that is the lesson of
  # 2026-09-21: the 12:17 cron landed at 18:12, a hand dispatch went out at
  # 18:13 believing the day had been skipped, concurrency queued it rather
  # than dropping it, and the pipeline drafted and translated a second story
  # nobody wanted. `force` is the override, and it is an input rather than
  # the mere act of dispatching for draft.py's reason: naming a candidate by
  # hand is an override, and a bare dispatch names nothing.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      draft: ${{ steps.check.outputs.draft }}
    steps:
      - uses: actions/checkout@v5

      - id: check
        env:
          FORCE: ${{ inputs.force }}
        run: |
          today=$(python3 -c "from datetime import date; print(f'{date.today():%Y-%m-%d}')")

          if [ "$FORCE" = "true" ]; then
            echo "draft=true" >> "$GITHUB_OUTPUT"
            echo "force was asked for — drafting whatever posts/ already holds."
            exit 0
          fi

          # Glob with no match expands to itself, so test the expansion rather
          # than trusting the shell to report emptiness.
          set -- posts/"$today"-*.json
          if [ -e "$1" ]; then
            echo "draft=false" >> "$GITHUB_OUTPUT"
            echo "Already drafted today ($today): $*"
            echo "Nothing to do — an earlier firing of this cron got there first."
            echo "Dispatch with force=true to draft a second post anyway."
          else
            echo "draft=true" >> "$GITHUB_OUTPUT"
            echo "No post dated $today in posts/ — this firing does the work."
          fi

  draft:
    needs: gate
    if: needs.gate.outputs.draft == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # review.yml is a separate job and so a separate checkout; the path it
    # reviews has to be handed across.
    outputs:
      post: ${{ steps.draft.outputs.post }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      # No Chromium here: drafting and translating are HTTP and LLM calls.
      # The browser download belongs to review.yml, which actually renders.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account credentials
        env:
          GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
        run: printf '%s' "$GOOGLE_SHEETS_CREDENTIALS_JSON" > credentials.json

      # draft.py with no arguments takes the highest-scoring queued row and
      # marks it drafted, then prints the file it wrote. If the sheet has
      # nothing queued it exits non-zero and the run fails loudly, which is
      # the right signal: the feeds have gone dry.
      - name: Draft the top-scoring story
        id: draft
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEETS_CREDENTIALS: credentials.json
        run: |
          python src/draft.py | tee draft.log
          post=$(sed -n 's/^Wrote //p' draft.log | tail -1)
          if [ -z "$post" ] || [ ! -f "$post" ]; then
            echo "::error::draft.py did not report a post file it wrote." >&2
            exit 1
          fi
          echo "post=$post" >> "$GITHUB_OUTPUT"

      # Machine Spanish lands on a public permalink, so it is reviewed at the
      # same gate as the slides: translate before the commit, and the review
      # message carries the Spanish for reading.
      - name: Translate for the web archive
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
        run: python src/translate.py "${{ steps.draft.outputs.post }}"

      # Committed before the slides are sent, and deliberately: the button in
      # Telegram carries only the filename, so the file has to be on master
      # before publish.yml can date it. Undated, site.py skips it. It is also
      # what lets review.yml run in its own checkout, and what lets
      # recheck.yml find the post again days later.
      - name: Commit the draft
        run: |
          git config user.name  "gummietech"
          git config user.email "noreply@github.com"
          git add "${{ steps.draft.outputs.post }}"
          git commit -m "Draft $(basename "${{ steps.draft.outputs.post }}" .json)"
          git pull --rebase
          git push

      # A failed run is silent unless somebody opens the Actions tab. See
      # .github/actions/notify-failure for why that is the thing to fix.
      - name: Say so in Telegram if this run broke
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}

  # A skipped `draft` skips this too — GitHub does not run a job whose
  # dependency was skipped — so a no-op firing sends no second message.
  review:
    needs: draft
    uses: ./.github/workflows/review.yml
    with:
      post: ${{ needs.draft.outputs.post }}
    secrets: inherit
