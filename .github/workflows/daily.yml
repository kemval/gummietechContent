name: daily

# Layers 3 through 4b, once a day: draft the top-scoring story, translate it,
# fact-check it against its source, render the slides, proof the layout, and
# put the lot in Telegram for approval.
#
# It stops there. The post JSON is committed without `published_at`, so
# site.py skips it and nothing reaches the web archive or Instagram until a
# person taps the button in Telegram — publish.yml is what picks that up.
#
# Both reviews ride into the Telegram message, and either one saying BLOCK
# (or fact-check saying UNVERIFIED) withholds the button entirely, so a post
# that failed review cannot be marked live from the phone at all.

on:
  schedule:
    # 12:17 UTC = 06:17 in America/Costa_Rica, which does not observe DST, so
    # this does not drift across the year. The offset minute is deliberate:
    # the top of the hour is the most contended slot on GitHub's scheduler.
    # Runs are still delayed 10-30 minutes at peak, so the message lands
    # around 06:30 local. Change the hour here to move it.
    - cron: '17 12 * * *'
  workflow_dispatch:

# Two drafts in flight would race on the sheet row and on the push.
concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write         # claude-code-action's default GitHub App auth

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Secrets cannot be read in a step `if:`, so presence is hoisted here.
      # Absent, fact-check is skipped rather than failing the run — see the
      # stand-in step for what that does to the button.
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # render.py and proof.py drive a real browser, so unlike site.yml this
      # one needs the Chromium download and its system libraries.
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Write service account credentials
        env:
          GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
        run: printf '%s' "$GOOGLE_SHEETS_CREDENTIALS_JSON" > credentials.json

      # draft.py with no arguments takes the highest-scoring queued row and
      # marks it drafted, then prints the file it wrote. If the sheet has
      # nothing queued it exits non-zero and the run fails loudly, which is
      # the right signal: the feeds have gone dry.
      - name: Draft the top-scoring story
        id: draft
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEETS_CREDENTIALS: credentials.json
        run: |
          python src/draft.py | tee draft.log
          post=$(sed -n 's/^Wrote //p' draft.log | tail -1)
          if [ -z "$post" ] || [ ! -f "$post" ]; then
            echo "::error::draft.py did not report a post file it wrote." >&2
            exit 1
          fi
          echo "post=$post" >> "$GITHUB_OUTPUT"

      # Machine Spanish lands on a public permalink, so it is reviewed at the
      # same gate as the slides: translate before the commit, and the review
      # message carries the Spanish for reading.
      - name: Translate for the web archive
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
        run: python src/translate.py "${{ steps.draft.outputs.post }}"

      # Committed before the slides are sent, and deliberately: the button in
      # Telegram carries only the filename, so the file has to be on master
      # before publish.yml can date it. Undated, site.py skips it.
      - name: Commit the draft
        run: |
          git config user.name  "gummietech"
          git config user.email "noreply@github.com"
          git add "${{ steps.draft.outputs.post }}"
          git commit -m "Draft $(basename "${{ steps.draft.outputs.post }}" .json)"
          git pull --rebase
          git push

      # The half a measurement cannot do: whether the slides are true. Runs on
      # the Pro subscription via the OAuth token, not API billing, so it stays
      # inside the $0 rule — `claude setup-token` mints it.
      #
      # The agent is read-only by contract (.claude/agents/fact-check.md), and
      # the settings below hold that on the runner too: it may write its report
      # under /tmp and nothing else. It reports; a person applies the edits.
      - name: Fact-check the draft against its source
        id: factcheck
        if: env.HAS_CLAUDE == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Use the fact-check agent defined in .claude/agents/fact-check.md
            to verify the post at ${{ steps.draft.outputs.post }} against the
            source it cites. Follow that file's instructions exactly,
            including its BLOCK / FIX / PASS report format.

            Write the complete report to /tmp/factcheck.md. Do not modify any
            file in posts/, do not render, and do not add published_at.
          claude_args: |
            --max-turns 30
            --allowedTools "Task,Read,Grep,Glob,Bash,WebFetch,WebSearch,Write"
          settings: |
            {
              "permissions": {
                "allow": ["Write(/tmp/**)"],
                "deny": ["Write(posts/**)", "Edit(posts/**)",
                         "Write(src/**)", "Edit(src/**)"]
              }
            }

      # Three outcomes, and only one of them is "reviewed".
      #   skipped  — no token configured yet. Say so without the gate words,
      #              so the button still works as it did before this existed.
      #   failed   — configured and broken, or it wrote nothing. That is an
      #              unknown, and fact-check.md is explicit that an
      #              unverifiable post is a hold: UNVERIFIED withholds the
      #              button.
      - name: Stand in for a fact-check that did not report
        run: |
          if [ -s /tmp/factcheck.md ]; then
            echo "fact-check reported."
            exit 0
          fi
          if [ "${{ steps.factcheck.outcome }}" = "skipped" ]; then
            cat > /tmp/factcheck.md <<'TXT'
          Not configured — no claim on this post has been checked against its source.
          Run `claude setup-token` locally and add the result as the repo secret
          CLAUDE_CODE_OAUTH_TOKEN to turn this on. Until then, open the source
          link above and read the slides against it yourself.
          TXT
          else
            cat > /tmp/factcheck.md <<'TXT'
          UNVERIFIED — fact-check was configured but produced no report.
          See the workflow run log. An unverifiable post is a hold, not a pass.
          TXT
          fi

      - name: Render the slides
        run: python src/render.py "${{ steps.draft.outputs.post }}"

      # Measures the page render.py just screenshotted: frame containment,
      # overflow, contrast, the preprint flag, the colorway rhythm. Exits 1 on
      # BLOCK, which is a finding to carry into the message rather than a
      # reason to abandon the run.
      - name: Proof the rendered layout
        continue-on-error: true
        run: python src/proof.py "${{ steps.draft.outputs.post }}" | tee /tmp/proof.md

      - name: Send to Telegram for approval
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python src/telegram.py send "${{ steps.draft.outputs.post }}" \
            --review /tmp/factcheck.md \
            --review /tmp/proof.md
