name: glossary

# The Tuesday glossary term, written by Claude and reviewed like any Drop.
#
# docs §1 puts a Glossary term out every Tuesday. Until 2026-10-06 a person
# wrote it. Now Claude does, here, and not the free-tier model draft.py uses:
# a definition is exactly where a model invents a confident one, and a
# glossary exists to be saved. This draws on the same Claude quota as fix.yml
# and an interactive session — one run a week.
#
# The model writes the words and nothing else. src/glossary.py decides
# whether the week still owes a term, offers only published posts as the
# example, refuses a repeated term, names the file, and copies the credit
# from the example post. review.yml then fact-checks the result in a session
# that never saw the writer, and the gate is a person's tap, as always.
#
# The Cheat Sheet that docs §1 puts in every sixth Tuesday's place is not
# written here yet; see docs §1.

on:
  schedule:
    # Four firings, one term: daily.yml's shape and reason. A daily cron
    # here lands hours late, so it asks early and often and the `gate` job
    # turns every firing after the first honoured one into a no-op.
    # 06:17 UTC = 00:17 in America/Costa_Rica, which has no DST.
    - cron: '17 6,8,10,12 * * 2'
  workflow_dispatch:
    inputs:
      force:
        description: >
          Write a term even though this week already has one — for a term
          turned down at the gate. Leave it off otherwise.
        type: boolean
        required: false
        default: false

# Two writers at once would both find the week empty and both commit.
concurrency:
  group: glossary
  cancel-in-progress: false

permissions:
  contents: write         # commits the term
  id-token: write         # claude-code-action's default GitHub App auth

jobs:
  gate:
    # Pinned — ubuntu-latest becomes 26.04 over Oct–Nov 2026. See docs/decisions/runner-pin.md.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      write: ${{ steps.check.outputs.write }}
    steps:
      - uses: actions/checkout@v5

      # glossary.py is stdlib only, so the runner's own python3 answers this
      # before anything is installed.
      - id: check
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "write=true" >> "$GITHUB_OUTPUT"
            echo "force was asked for — writing a term whatever posts/ holds."
          elif python3 src/glossary.py due; then
            echo "write=true" >> "$GITHUB_OUTPUT"
          else
            echo "write=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to do — dispatch with force=true to write another."
          fi

  write:
    needs: gate
    if: needs.gate.outputs.write == 'true'
    # Pinned — ubuntu-latest becomes 26.04 over Oct–Nov 2026. See docs/decisions/runner-pin.md.
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    outputs:
      post: ${{ steps.file.outputs.post }}

    steps:
      - uses: actions/checkout@v5

      # The same stop fix.yml makes: without the token there is no writer,
      # and the action's own failure would read as a broken workflow rather
      # than an unconfigured one.
      - name: Check there is a writer to run
        env:
          HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_CLAUDE" != "true" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set, so nothing can write the term. Run \`claude setup-token\` and add it as a repo secret, or write the term by hand." >&2
            exit 1
          fi

      - name: List what the term may be built from
        run: |
          mkdir -p /tmp/glossary
          python3 src/glossary.py brief | tee /tmp/glossary/brief.txt

      # Writes one JSON file outside the repo. It may read the repo and the
      # example post's source; it may write nothing but /tmp/glossary.
      - name: Write the term
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Write this week's glossary term for @gummietech, an Instagram
            account on science and technology, tech first.

            Read first:
              - docs/gummietech_content_system.md, the Glossary under §1
              - src/formats.py, the "term" entry
              - posts/2026-10-06-glossary-hallucination.json, a term that
                passed the gate — match its shape and its register
              - /tmp/glossary/brief.txt, the terms already defined and the
                published posts you may choose from

            Then:
              1. Pick one example post from brief.txt and read its JSON in
                 posts/. Prefer an AI, computing or software post. Pick a term
                 a curious non-specialist meets in the news and would want to
                 keep the meaning of, which that post shows in action.
              2. Read the post's source_url. The definition must agree with
                 how that source uses the word. If it cannot be read, pick
                 another post rather than defining from memory.
              3. Write /tmp/glossary/term.json with exactly these fields:
                 post_type ("term"), domain, colorway (signal, orbit, bloom
                 or ember, by docs §1's topics), hook, term, definition,
                 example, the_catch, example_post (the stem, no .json),
                 caption, keywords, hashtags, alt_text.

            Rules:
              - example says what that post showed, in that post's own facts.
                Do not add a number or a claim that is not in the post or its
                source.
              - the_catch is the common mistake people make with the word —
                a misreading, not a weakness of the paper.
              - hook within 12 words; definition, example and the_catch
                within 25 words each.
              - caption ends in a question.
              - Do NOT write source_url, doi, attribution, peer_reviewed, es
                or published_at. Code copies the credit from the example post
                after you; the rest is not yours to write.
              - Write no other file.

            Finish by printing the term, the example post, and one line on
            why you chose them.
          show_full_output: true
          claude_args: |
            --max-turns 30
            --allowedTools "Read,Write,Glob,Grep,WebFetch"
          settings: |
            {
              "permissions": {
                "allow": ["Read(//tmp/glossary/**)", "Write(//tmp/glossary/**)"],
                "deny": ["Write(posts/**)", "Edit(posts/**)",
                         "Write(src/**)", "Edit(src/**)",
                         "Write(.github/**)", "Edit(.github/**)",
                         "Write(templates/**)", "Edit(templates/**)"]
              }
            }

      # The settings above are the writer's contract; this does not depend
      # on the writer honouring them. A prompt is an instruction, a diff is a
      # fact.
      - name: Check the writer changed nothing in the repo
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The writer changed files in the repo: $(git status --porcelain | tr '\n' ' '). Nothing has been committed." >&2
            exit 1
          fi
          if [ ! -s /tmp/glossary/term.json ]; then
            echo "::error::The writer did not write /tmp/glossary/term.json. Read its output above for why." >&2
            exit 1
          fi

      # Refuses a repeated term, an unpublished or reused example, a missing
      # field, published_at; then copies the credit and names the file.
      - name: File the term in posts/
        id: file
        run: |
          python3 src/glossary.py finish /tmp/glossary/term.json | tee finish.log
          post=$(sed -n 's/^Wrote //p' finish.log | tail -1)
          if [ -z "$post" ] || [ ! -f "$post" ]; then
            echo "::error::glossary.py did not report the file it wrote." >&2
            exit 1
          fi
          echo "post=$post" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      # No `playwright install`: translate.py needs the package, not the
      # browsers. review.yml downloads Chromium when it renders.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Translate for the web archive
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: python src/translate.py "${{ steps.file.outputs.post }}"

      # Before review.yml, which reads the post from its own checkout — the
      # same reason daily.yml commits first. Over an explicitly authenticated
      # remote, because claude-code-action replaces the credential checkout
      # installs; fix.yml's first run died on exactly that.
      - name: Commit the term
        env:
          POST: ${{ steps.file.outputs.post }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "gummietech"
          git config user.email "noreply@github.com"
          git add "$POST"
          git commit -m "Draft $(basename "$POST" .json)" \
                     -m "Written by .github/workflows/glossary.yml. Reviewed by review.yml before the gate; undated, so unpublished."
          git pull --rebase "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" master
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" HEAD:master

      - name: Say so in Telegram if this run broke
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}

  # A skipped `write` skips this too, so a no-op firing sends nothing.
  review:
    needs: write
    uses: ./.github/workflows/review.yml
    with:
      post: ${{ needs.write.outputs.post }}
    secrets: inherit
