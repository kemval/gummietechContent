name: check

# The half of the pipeline that can be exercised without secrets, without the
# network and without spending an LLM call — run on every push, so it breaks
# here instead of at 06:17 in front of a person with a phone.
#
# It exists because of what the first fortnight actually failed on: a package
# publish.yml did not install, a fixture that stopped rendering, Spanish left
# behind by a correction. Every one of those was found in production, hours
# after the commit that caused it.
#
# Three jobs. `smoke` runs the offline half of the pipeline end to end and is
# deliberately not a test suite. `tests` is the test suite, over the pure
# functions that have been silently wrong before — a different question, so a
# different job. `publish-deps` is an environment, not a check.
#
# What it does NOT cover, so nobody mistakes green for safe: anything that
# needs a real run — the Telegram message cap, a checkout resolving to the
# wrong SHA, a provider's 429. Those still fail where they happen.
#
# Commits pushed by the workflows themselves use GITHUB_TOKEN, which by design
# does not trigger other workflows, so a bot-committed draft is not checked
# here. A hand correction at the gate is pushed by a person, and is. That hole
# is why `workflow_call` is below: watch.yml calls this on a cron so the three
# drafts a week the bot commits are exercised too. One definition of "the
# offline half still runs", two callers — review.yml's arrangement, for
# review.yml's reason.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke:
    name: render, proof and archive the fixture
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      # Loaded by path, not by name: `import site` would find the standard
      # library's and silently never touch src/site.py. Executing each module
      # catches a missing dependency, a syntax error and an import cycle —
      # the class of break that otherwise surfaces as a 3am ModuleNotFoundError.
      - name: Every module still loads
        run: |
          python - <<'PY'
          import importlib.util, pathlib, sys
          sys.path.insert(0, "src")
          failed = []
          for f in sorted(pathlib.Path("src").glob("*.py")):
              spec = importlib.util.spec_from_file_location(f"smoke_{f.stem}", f)
              try:
                  spec.loader.exec_module(importlib.util.module_from_spec(spec))
                  print(f"  ok    {f}")
              except BaseException as exc:
                  print(f"  FAIL  {f}: {type(exc).__name__}: {exc}")
                  failed.append(f)
          sys.exit(f"::error::{len(failed)} module(s) failed to load" if failed else 0)
          PY

      # posts/era.json is the fixture from the first commit: undated, so the
      # archive never publishes it, which is what makes it safe to render on
      # every push. Fonts and templates are local, so this is entirely offline.
      # One fixture per carousel format: era.json is a five-slide Drop,
      # era-breakdown.json an eight-slide Breakdown, era-signal.json a
      # seven-slide Signal with five sources. All three are undated, so the
      # archive never publishes them, which is what makes them safe to render
      # on every push. A format with no fixture here is a format nothing
      # exercises until a person is waiting for it at the gate — which is
      # exactly how signal.html shipped its first layout with the credit line
      # sitting on top of the wordmark.
      - name: Render every format
        run: |
          for post in era era-breakdown era-signal; do
            python src/render.py "posts/$post.json" --outdir "/tmp/smoke-$post"
          done

      - name: Proof every format
        run: |
          for post in era era-breakdown era-signal; do
            python src/proof.py "posts/$post.json"
          done

      # Builds every published post, so a template change that breaks one page
      # shows up here rather than on the live archive.
      - name: Build the web archive
        run: python src/site.py --outdir /tmp/site

      # Makes no LLM call. Red means a post's English moved after it was
      # translated — which is exactly what the gate does to it — and the
      # Spanish on its permalink would still be saying the old thing.
      - name: No post carries stale Spanish
        run: python src/translate.py --check

  tests:
    name: the pure functions that have been silently wrong
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A separate job from `smoke`, not more steps inside it, for the reason
    # this file is not a test suite: smoke answers "does the pipeline still
    # run end to end", these answer "does this function still do what the
    # post-mortem says it must". A red here names a behaviour; a red there
    # names a stage.
    #
    # Every test is a case the repository has already got wrong once —
    # crediting a paper's own reference list, a report held by its own
    # summary of having found nothing, Spanish reported as up to date that
    # nothing could check. None of them touch the network or an LLM.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      # requirements-dev.txt pulls in requirements.txt and adds pytest.
      # Playwright's browser is not installed: nothing here opens a page,
      # and proof.py's measurements are arithmetic on numbers a page would
      # have produced.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run the tests
        run: python -m pytest

  publish-deps:
    name: telegram.py under publish.yml's two packages
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # publish.yml installs `requests python-dotenv` rather than
    # requirements.txt, because it is the most frequently run workflow here
    # and telegram.py stays
    # clear of Playwright. That list is kept by hand against telegram.py's
    # imports, and the day it fell behind, `confirm` died at module load on
    # every poll until somebody opened the Actions tab. This is that exact
    # environment: do not add an install step here, the emptiness is the test.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install what publish.yml installs
        run: pip install requests python-dotenv

      - name: telegram.py loads and parses its arguments
        run: |
          python src/telegram.py --help
          python src/telegram.py send --help
          python src/telegram.py confirm --help
