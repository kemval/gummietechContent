name: fix

# The other way back from a held post, from a phone.
#
# recheck.yml runs the same review again, which is the answer when the *check*
# broke. This one is the answer when the check was right: it applies what the
# fact-check asked for, commits, and sends the corrected post back through
# review.yml for a fresh, independent fact-check. Both are links in the held
# message, so neither needs a laptop.
#
# Three things it does not do, and must not start doing:
#
#   - It never adds published_at. Layer 5 is untouched: the corrected slides
#     come back to the chat for approval exactly like the first draft, and the
#     carousel still goes to Instagram by hand.
#   - It never grades its own work. The applier writes the edits; the
#     fact-check that decides whether the post is now true is the one
#     review.yml runs afterwards, in a session that never saw the applier.
#   - It never invents. The report either supplies a replacement or the claim
#     comes out — see the prompt. The failure mode being repaired here is a
#     model writing a fluent caveat the paper does not state, and a repair
#     that is free to write a new one is not a repair.
#
# It is dispatched by tap, never scheduled. Some BLOCKs are the checker being
# wrong rather than the post, and spending a Claude run on every one of those
# would burn the quota that the checking itself needs.

on:
  workflow_dispatch:
    inputs:
      post:
        description: 'Post JSON path. Leave blank for the one awaiting approval.'
        required: false
        type: string

# Two fixes at once would race on the same file and push over each other.
concurrency:
  group: fix
  cancel-in-progress: false

permissions:
  contents: write         # commits the corrected post
  actions: read           # reads the held run's report artifact
  id-token: write         # claude-code-action's default GitHub App auth

jobs:
  apply:
    # Pinned — ubuntu-latest becomes 26.04 over Oct–Nov 2026. See docs/decisions/runner-pin.md.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    outputs:
      post: ${{ steps.pick.outputs.post }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: master

      - id: pick
        uses: ./.github/actions/resolve-post
        with:
          post: ${{ inputs.post }}
          token: ${{ github.token }}

      # Without the token there is no applier, and the action's own failure
      # would read as a broken workflow rather than an unconfigured one.
      # review.yml skips its fact-check in this case and says so; here there
      # is nothing to skip to, so say it and stop.
      - name: Check there is an applier to run
        env:
          HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_CLAUDE" != "true" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set, so nothing can apply the report. Run \`claude setup-token\` and add it as a repo secret, or edit the post by hand." >&2
            exit 1
          fi

      # The report the person actually read before tapping, not a fresh one.
      # review.yml uploads it as reports-<stem> on every run, `always()`, for
      # exactly this. Retention is 14 days; a post held longer than that is one
      # to re-check rather than to repair blind.
      - name: Fetch the fact-check that held this post
        env:
          GH_TOKEN: ${{ github.token }}
          STEM: ${{ steps.pick.outputs.stem }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100&name=reports-$STEM" \
                 --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .id')
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "::error::No surviving report for $STEM. Its artifact has expired, or this post has never been reviewed. Tap 'Re-run the checks' first, then fix." >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > /tmp/reports.zip
          unzip -o -q /tmp/reports.zip -d /tmp/reports
          if [ ! -s /tmp/reports/factcheck.md ]; then
            echo "::error::The report for $STEM has no factcheck.md in it. Tap 'Re-run the checks' first." >&2
            exit 1
          fi
          echo "Report from artifact $id:"
          head -3 /tmp/reports/factcheck.md

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: 'pip'

      # No `playwright install` here: translate.py imports render.py for
      # ES_FIELDS, and the applier's budget check runs render.py --budget;
      # both need the playwright package but not its browsers. review.yml
      # downloads Chromium when it renders.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # The same applier review.yml's auto-fix runs, prompt and guard and all:
      # one definition, so the two cannot drift. It commits and pushes before
      # review.yml, which reads the post from its own checkout of master.
      - name: Apply what the fact-check asked for
        id: fix
        uses: ./.github/actions/apply-factcheck
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        with:
          post: ${{ steps.pick.outputs.post }}
          report: /tmp/reports/factcheck.md
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          token: ${{ github.token }}

      # A tap that changed nothing is a failed run: the person asked for a
      # fix, and re-reviewing an unchanged post would only send it back held.
      - name: Stop if nothing was applied
        if: steps.fix.outputs.applied != 'true'
        env:
          WHY: ${{ steps.fix.outputs.why }}
        run: |
          echo "::error::$WHY" >&2
          exit 1

      - name: Say so in Telegram if this run broke
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}

  # The independent grade. A fresh fact-check, a fresh proof, a fresh message.
  review:
    needs: apply
    uses: ./.github/workflows/review.yml
    with:
      post: ${{ needs.apply.outputs.post }}
    secrets: inherit
