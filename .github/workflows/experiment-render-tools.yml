name: experiment-render-tools

# TEMPORARY — deleted before this branch merges. Proves the off-mirror
# install-render-tools: the slides render identically without apt's
# libraries and fonts, ffmpeg from PyPI films a clip, and poppler's cache
# is saved by one job and installed by the next.

on:
  push:
    branches: [fix/render-tools-off-mirror]

permissions:
  contents: read

jobs:
  parity:
    # Pinned — ubuntu-latest becomes 26.04 over Oct–Nov 2026. See docs/decisions/runner-pin.md.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Install off the mirror
        uses: ./.github/actions/install-render-tools
        with:
          ffmpeg: 'true'
          poppler: 'true'

      - name: Tools in place
        run: |
          command -v ffmpeg
          ffmpeg -hide_banner -encoders | grep libx264
          pdftoppm -v

      - name: Render twice off the mirror (is the render deterministic?)
        run: |
          for run in a1 a2; do
            for post in era era-breakdown era-signal; do
              python src/render.py "posts/$post.json" --outdir "/tmp/$run/$post" --no-motion
            done
          done
          python src/proof.py posts/era.json

      - name: Film one post's motion clips with the PyPI ffmpeg
        run: |
          python src/render.py posts/era.json --outdir /tmp/motion
          ls -la /tmp/motion

      - name: Add apt's libraries and fonts, the old way
        run: sudo timeout 15m "$(command -v python)" -m playwright install-deps chromium

      - name: Render with them
        run: |
          for post in era era-breakdown era-signal; do
            python src/render.py "posts/$post.json" --outdir "/tmp/b/$post" --no-motion
          done

      - name: Compare
        run: |
          sums() { (cd "$1" && find . -name '*.png' -print0 | sort -z | xargs -0 sha256sum); }
          sums /tmp/a1 > /tmp/a1.txt; sums /tmp/a2 > /tmp/a2.txt; sums /tmp/b > /tmp/b.txt
          wc -l /tmp/a1.txt
          echo "== off-mirror vs itself"; diff /tmp/a1.txt /tmp/a2.txt && echo identical
          echo "== off-mirror vs with apt"; diff /tmp/a1.txt /tmp/b.txt && echo identical

  cache-hit:
    needs: parity
    # Pinned — ubuntu-latest becomes 26.04 over Oct–Nov 2026. See docs/decisions/runner-pin.md.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/install-render-tools
        with:
          chromium: 'false'
          poppler: 'true'
      - run: pdftoppm -v
