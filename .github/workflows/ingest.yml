name: ingest

# Layers 1 and 2, every two hours: pull the feeds, then score what's new.
# Drafting and rendering stay manual — Layer 5 is a human gate.
#
# GitHub delays scheduled runs by 10-30 minutes at peak, and disables
# schedules entirely after 60 days without repo activity. Neither matters
# for a 2-hour cycle, but nothing here may assume punctual execution.

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

# A slow run must not overlap the next one: both would write the same
# feed items to the sheet before either had finished deduping.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    # Pinned — ubuntu-latest becomes 26.04 over Oct–Nov 2026. See docs/decisions/runner-pin.md.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # gspread wants a file, and a secret is a string. Written to the
      # workspace, which is destroyed with the runner.
      - name: Write service account credentials
        env:
          GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
        run: printf '%s' "$GOOGLE_SHEETS_CREDENTIALS_JSON" > credentials.json

      - name: Ingest feeds
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEETS_CREDENTIALS: credentials.json
        run: python src/ingest.py

      # Scoring runs on Gemini 3.5 Flash Lite, fixed here, whatever the
      # LLM_PROVIDER repo variable says — that variable is for drafting and
      # translating. Scoring is the volume: 37-68 calls on a weekday. Gemini
      # 3.5 Flash's free tier allows 20 a day, Flash Lite's 500 (AI Studio,
      # 2026-10-08). On Groq it spent the 200k-token daily cap the drafts
      # need, on 2026-09-30 and 10-01. Measured on 54 rows Groq had scored:
      # the same queue decision on 49, mean difference +0.01, and with the
      # relevance lift it lifted the day's three launches and no marketing.
      # A 5xx still fails over down llm.FALLBACK_ORDER; a spent daily cap
      # stops the run. See docs/decisions/llm-providers.md.
      # Every key secret is passed: an unused one is just an empty string.
      - name: Score new items
        env:
          LLM_PROVIDER: gemini
          GEMINI_MODEL: gemini-3.5-flash-lite
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEETS_CREDENTIALS: credentials.json
        run: python src/score.py

      # A failed run is silent unless somebody opens the Actions tab. See
      # .github/actions/notify-failure for why that is the thing to fix.
      - name: Say so in Telegram if this run broke
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
