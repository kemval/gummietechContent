name: publish

# The far side of the human gate. Polls Telegram for the "Posted to
# Instagram" tap, stamps `published_at` on the post it names, commits that,
# and asks site.yml to rebuild — which is what puts the post on the archive.
#
# Nothing here decides anything: the tap is a person saying the carousel is
# live, and this only writes down the date.

on:
  schedule:
    # This asks for quarter-hourly and does not get it. A cron on the free
    # tier is a request, not a promise: measured on 2026-09-20 this workflow
    # ran eight times in 19.5 hours — 06:04, 10:52, 14:01, 17:15, 19:24,
    # 21:31, 23:30, 01:36 UTC. So the real latency between the tap and the
    # site is a couple of hours, which is what the Telegram message says.
    # The request stays at */15 because asking for less would only make the
    # delivered cadence sparser; nothing here is correctness-dependent on it
    # (`confirm` is idempotent, and a tap replays for 24 hours), but anything
    # rate-limited to one per poll drains about eight times slower than this
    # line suggests.
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Two polls at once would both see the same tap and race on the push.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  actions: write          # to dispatch site.yml — see the note below

jobs:
  confirm:
    # Pinned — ubuntu-latest becomes 26.04 over Oct–Nov 2026. See CLAUDE.md.
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      # Not requirements.txt: this job runs on the most frequent cron here,
      # and telegram.py
      # deliberately does not import render.py, which would drag in Playwright.
      # These two are telegram.py's entire non-stdlib surface — keep them in
      # step with its imports, or `confirm` dies at module load.
      - name: Install dependencies
        run: pip install requests python-dotenv

      # Also Layer 7: the same poll asks a settled post for its Instagram
      # numbers and writes back the reply. The chat id is needed for that
      # half only — a tap answers in the chat it came from, a question has
      # to be started in one. Leave it unset and taps still work.
      - id: poll
        name: Look for a publish tap, and for the numbers
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLISH_TZ: ${{ vars.PUBLISH_TZ }}
        run: python src/telegram.py confirm

      - name: Commit, and build the archive if anything on it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Both pillars: a tap dates a carousel in posts/ or a status
          # report in series/reports/, and the metrics half writes back to
          # either. Which of the two happened is what `published` below says.
          if git diff --quiet -- posts/ series/reports/; then
            echo "Nothing to record."
            exit 0
          fi
          # published_at is the only thing here that reaches a page — site.py
          # ignores the metrics block entirely — so a numbers-only poll must
          # not ask for a rebuild that would produce byte-identical HTML.
          # The answer comes from the step above rather than from the diff:
          # a metrics block written next to published_at puts a comma on that
          # line, so the diff says "published" on a poll that published
          # nothing. A status-report tap is the same trap from the other side
          # — it writes published_at, but site.py never reads series/, so it
          # must not rebuild either. confirm() counts the two separately.
          if [ "${{ steps.poll.outputs.published }}" = true ]; then
            subject="Publish to the archive"
            rebuild=yes
          else
            subject="Log the Instagram numbers"
            rebuild=no
          fi
          git config user.name  "gummietech"
          git config user.email "noreply@github.com"
          git add posts/ series/reports/
          git commit -m "$subject" \
                     -m "$(git diff --cached --name-only)"
          git pull --rebase
          git push
          # A push made with GITHUB_TOKEN does not fire site.yml's push
          # trigger: GitHub suppresses that to stop workflows triggering
          # themselves. workflow_dispatch is the documented exception, so ask
          # for the build by name. --ref master builds the tip, which now
          # includes the commit above.
          # An `if`, not `[ ... ] && ...`: this is the last command in the
          # step and the runner uses `bash -e`, so a false test would exit
          # non-zero and fail a poll that did exactly what it should.
          if [ "$rebuild" = yes ]; then
            gh workflow run site.yml --ref master
          else
            echo "Numbers only — the archive is unchanged, not rebuilding."
          fi

      # A failed run is silent unless somebody opens the Actions tab. See
      # .github/actions/notify-failure for why that is the thing to fix.
      - name: Say so in Telegram if this run broke
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
