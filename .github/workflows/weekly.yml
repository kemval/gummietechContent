name: weekly

# The weekly carousels Claude writes: the glossary term on Tuesday, the
# Breakdown on Thursday. Each is then reviewed like any Drop.
#
# Neither is drafted by draft.py's free-tier model: a definition and a
# mechanism are exactly where a model invents a confident one, and docs §4
# gives both to Claude. Until 2026-10-06 a person ran that session; now this
# does. It draws on the same Claude quota as fix.yml and an interactive
# session — one run per kind per week.
#
# The model writes the words and nothing else. src/weekly.py decides whether
# the week still owes the post, what it is built from, refuses a bad draft,
# names the file and copies the credit from the post it builds on.
# review.yml then fact-checks the result in a session that never saw the
# writer, and the gate is a person's tap, as always.
#
# The Cheat Sheet, which docs §1 puts in every sixth Tuesday's place, is
# still a person's: the format credits one source, and five gathered terms
# have five.

on:
  schedule:
    # Four firings per day, one post: daily.yml's shape and reason. A daily
    # cron here lands hours late, so it asks early and often and the `gate`
    # job turns every firing after the first honoured one into a no-op.
    # 06:17 UTC = 00:17 in America/Costa_Rica, which has no DST. Tuesday is
    # the glossary, Thursday the Breakdown — weekly.KINDS says which.
    - cron: '17 6,8,10,12 * * 2,4'
  workflow_dispatch:
    inputs:
      kind:
        description: Which post to write.
        type: choice
        options: [glossary, breakdown]
        required: true
      force:
        description: >
          Write one even though this week already has one — for a post
          turned down at the gate. Leave it off otherwise.
        type: boolean
        required: false
        default: false

# Two writers at once would both find the week empty and both commit.
concurrency:
  group: weekly
  cancel-in-progress: false

permissions:
  contents: write         # commits the post
  id-token: write         # claude-code-action's default GitHub App auth

jobs:
  gate:
    # Pinned — ubuntu-latest becomes 26.04 over Oct–Nov 2026. See docs/decisions/runner-pin.md.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      write: ${{ steps.check.outputs.write }}
      kind: ${{ steps.check.outputs.kind }}
    steps:
      - uses: actions/checkout@v5

      # weekly.py is stdlib only, so the runner's own python3 answers this
      # before anything is installed. A cron run takes its kind from the
      # weekday, on the same runner clock `due` reads.
      - id: check
        env:
          KIND: ${{ inputs.kind }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ -z "$KIND" ]; then
            KIND=$(python3 -c 'import sys; sys.path.insert(0, "src"); from datetime import date; from weekly import KINDS; print(next((n for n, k in KINDS.items() if k.weekday == date.today().weekday()), ""))')
          fi
          if [ -z "$KIND" ]; then
            echo "write=false" >> "$GITHUB_OUTPUT"
            echo "Nothing is written on this weekday."
            exit 0
          fi
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          if [ "$FORCE" = "true" ]; then
            echo "write=true" >> "$GITHUB_OUTPUT"
            echo "force was asked for — writing a $KIND whatever posts/ holds."
          elif python3 src/weekly.py due "$KIND"; then
            echo "write=true" >> "$GITHUB_OUTPUT"
          else
            echo "write=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to do — dispatch with force=true to write another."
          fi

  write:
    needs: gate
    if: needs.gate.outputs.write == 'true'
    # Pinned — ubuntu-latest becomes 26.04 over Oct–Nov 2026. See docs/decisions/runner-pin.md.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      KIND: ${{ needs.gate.outputs.kind }}

    outputs:
      post: ${{ steps.file.outputs.post }}

    steps:
      - uses: actions/checkout@v5

      # The same stop fix.yml makes: without the token there is no writer,
      # and the action's own failure would read as a broken workflow rather
      # than an unconfigured one.
      - name: Check there is a writer to run
        env:
          HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_CLAUDE" != "true" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set, so nothing can write the $KIND. Run \`claude setup-token\` and add it as a repo secret, or write it by hand." >&2
            exit 1
          fi

      # The whole instruction, with what code already chose filled in: the
      # terms taken and the posts a term may use, or the Drop a Breakdown
      # explains. Exits non-zero, with what to do, when nothing is left.
      - name: Write the brief
        run: |
          mkdir -p /tmp/weekly
          python3 src/weekly.py brief "$KIND" | tee /tmp/weekly/brief.md

      # Writes one JSON file outside the repo. It may read the repo and the
      # source; it may write nothing but /tmp/weekly.
      - name: Write the post
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read /tmp/weekly/brief.md and do exactly what it says.
          show_full_output: true
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Write,Glob,Grep,WebFetch"
          settings: |
            {
              "permissions": {
                "allow": ["Read(//tmp/weekly/**)", "Write(//tmp/weekly/**)"],
                "deny": ["Write(posts/**)", "Edit(posts/**)",
                         "Write(src/**)", "Edit(src/**)",
                         "Write(.github/**)", "Edit(.github/**)",
                         "Write(templates/**)", "Edit(templates/**)"]
              }
            }

      # The settings above are the writer's contract; this does not depend
      # on the writer honouring them. A prompt is an instruction, a diff is a
      # fact.
      - name: Check the writer changed nothing in the repo
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The writer changed files in the repo: $(git status --porcelain | tr '\n' ' '). Nothing has been committed." >&2
            exit 1
          fi
          if [ ! -s /tmp/weekly/draft.json ]; then
            echo "::error::The writer did not write /tmp/weekly/draft.json. Read its output above for why — a source it could not read in full is one." >&2
            exit 1
          fi

      # Refuses a bad draft; then copies the credit and names the file.
      - name: File the post in posts/
        id: file
        run: |
          python3 src/weekly.py finish "$KIND" /tmp/weekly/draft.json | tee finish.log
          post=$(sed -n 's/^Wrote //p' finish.log | tail -1)
          if [ -z "$post" ] || [ ! -f "$post" ]; then
            echo "::error::weekly.py did not report the file it wrote." >&2
            exit 1
          fi
          echo "post=$post" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      # No `playwright install`: translate.py needs the package, not the
      # browsers. review.yml downloads Chromium when it renders.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Translate for the web archive
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: python src/translate.py "${{ steps.file.outputs.post }}"

      # Before review.yml, which reads the post from its own checkout — the
      # same reason daily.yml commits first. Pushed by
      # .github/actions/push-to-master.
      - name: Commit the post
        env:
          POST: ${{ steps.file.outputs.post }}
        run: |
          git config user.name  "gummietech"
          git config user.email "noreply@github.com"
          git add "$POST"
          git commit -m "Draft $(basename "$POST" .json)" \
                     -m "Written by .github/workflows/weekly.yml ($KIND). Reviewed by review.yml before the gate; undated, so unpublished."

      - name: Push to master
        uses: ./.github/actions/push-to-master
        with:
          token: ${{ github.token }}

      - name: Say so in Telegram if this run broke
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}

  # A skipped `write` skips this too, so a no-op firing sends nothing.
  review:
    needs: write
    uses: ./.github/workflows/review.yml
    with:
      post: ${{ needs.write.outputs.post }}
    secrets: inherit
