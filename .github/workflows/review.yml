name: review

# Layers 3b through 4b for a post that already exists on master: fact-check it
# against its source, render the slides, proof the layout, and put the lot in
# Telegram for approval.
#
# It lives in its own file because several callers need it and the gate below must
# not drift between them. `daily.yml` runs it on the post it has just drafted;
# `recheck.yml` runs it again on a post whose first review broke. A second copy
# of the gate would be a second place to forget to hold a post.
#
# It never drafts and never dates a post. The caller commits first,
# deliberately: the Telegram button carries only the filename, so the file has
# to be on master before publish.yml can find it. The one commit it makes is
# the auto-fix's — a fact-check's own edits, applied and pushed before the
# render, for the same reason.

on:
  workflow_call:
    inputs:
      post:
        description: Path to the post JSON, relative to the repo root.
        required: true
        type: string

permissions:
  contents: write         # the auto-fix commits the edits it applies
  id-token: write         # claude-code-action's default GitHub App auth

jobs:
  review:
    # Pinned — ubuntu-latest becomes 26.04 over Oct–Nov 2026. See docs/decisions/runner-pin.md.
    runs-on: ubuntu-24.04
    # 2–10 minutes measured on 2026-10-08 for one fact-check; the auto-fix
    # can add two more, and two applier runs with a re-translation each
    # (fix.yml's took 9 minutes on 2026-10-23). The rest is room for
    # install-render-tools' second attempt.
    timeout-minutes: 60

    env:
      # Secrets cannot be read in a step `if:`, so presence is hoisted here.
      # Absent, fact-check is skipped rather than failing the run — see the
      # stand-in step for what that does to the button.
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}

    steps:
      # Explicitly the branch tip, not the default `github.sha`. For a
      # reusable workflow that SHA is the caller's *triggering* commit — for
      # daily.yml's schedule, master as it stood at 12:17 UTC, which is
      # before the draft job committed the post this run is here to review.
      # The default checkout therefore never sees the file and the step
      # below fails with "is not on master" on every scheduled run.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: master

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # render.py and proof.py drive a real browser, so this one needs the
      # Chromium download and its system libraries; render.py films a
      # looping clip of each slide's moving backdrop, and ffmpeg is not on
      # the runner image (see reel.yml). Bounded and retried: see the action.
      - uses: ./.github/actions/install-render-tools
        with:
          ffmpeg: 'true'

      # daily.yml always passes a path it has just committed, but recheck.yml
      # can be dispatched with one typed on a phone. Fail here with a sentence
      # rather than three steps later with a stack trace.
      - name: Check the post is on master
        id: post
        env:
          POST: ${{ inputs.post }}
        run: |
          if [ ! -f "$POST" ]; then
            echo "::error::$POST is not on master. Check the path, or leave the recheck input blank to pick the post still awaiting approval." >&2
            exit 1
          fi
          # Names the artifact below. A stem has no characters an artifact
          # name rejects; the full path would, because of the slash.
          echo "stem=$(basename "$POST" .json)" >> "$GITHUB_OUTPUT"

      - name: Fact-check the draft against its source
        id: fc0
        uses: ./.github/actions/fact-check
        with:
          post: ${{ inputs.post }}
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      # The auto-fix: a report that asks for edits gets them applied, and the
      # corrected post a fresh fact-check, before anything reaches the chat.
      # Until 2026-10-23 every such report cost a person a tap on "Apply the
      # fixes", a fix.yml run and a second review — for edits the report had
      # already written out word for word.
      #
      # BLOCK and FIX only. UNVERIFIED means the source could not be read, and
      # no edit repairs that. Two rounds, never more: on 2026-10-23 the second
      # fact-check rejected the catch the first had written, and checker and
      # applier could trade lines for as long as the quota lasted. After the
      # second round whatever the report says goes to the chat, held or not,
      # and "Apply the fixes" is still there.
      #
      # Each round's report is kept beside the final one, so the chat and the
      # artifact show what was asked for and applied, not just the last word.
      - name: Set aside the report for round 1
        id: r1
        if: env.HAS_CLAUDE == 'true' && (steps.fc0.outputs.verdict == 'BLOCK' || steps.fc0.outputs.verdict == 'FIX')
        run: mv /tmp/factcheck.md /tmp/factcheck.round-1.md

      - name: Apply round 1
        id: fix1
        if: steps.r1.outcome == 'success'
        uses: ./.github/actions/apply-factcheck
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        with:
          post: ${{ inputs.post }}
          report: /tmp/factcheck.round-1.md
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          token: ${{ github.token }}

      - name: Fact-check the corrected post
        id: fc1
        if: steps.fix1.outputs.applied == 'true'
        uses: ./.github/actions/fact-check
        with:
          post: ${{ inputs.post }}
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Set aside the report for round 2
        id: r2
        if: steps.fc1.outputs.verdict == 'BLOCK' || steps.fc1.outputs.verdict == 'FIX'
        run: mv /tmp/factcheck.md /tmp/factcheck.round-2.md

      - name: Apply round 2
        id: fix2
        if: steps.r2.outcome == 'success'
        uses: ./.github/actions/apply-factcheck
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        with:
          post: ${{ inputs.post }}
          report: /tmp/factcheck.round-2.md
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          token: ${{ github.token }}

      - name: Fact-check the corrected post again
        id: fc2
        if: steps.fix2.outputs.applied == 'true'
        uses: ./.github/actions/fact-check
        with:
          post: ${{ inputs.post }}
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      # What the auto-fix did, as one more report in the chat. A round whose
      # edit was refused leaves its report as the one the gate reads — the
      # post is exactly as that report found it — with the reason beneath.
      # No verdict line and none of the gate's words, so this note never
      # holds or releases anything by itself (telegram.blocked_by).
      - name: Say what the auto-fix did
        if: steps.r1.outcome == 'success'
        env:
          APPLIED1: ${{ steps.fix1.outputs.applied }}
          WHY1: ${{ steps.fix1.outputs.why }}
          RAN2: ${{ steps.r2.outcome }}
          APPLIED2: ${{ steps.fix2.outputs.applied }}
          WHY2: ${{ steps.fix2.outputs.why }}
        run: |
          {
            echo "AUTO-FIX — the fact-check's edits, applied before this message."
            echo
            if [ "$APPLIED1" = "true" ]; then
              echo "Round 1: applied and committed; the post was fact-checked again."
            else
              echo "Round 1: not applied. $WHY1"
            fi
            if [ "$RAN2" = "success" ]; then
              if [ "$APPLIED2" = "true" ]; then
                echo "Round 2: applied and committed; the post was fact-checked again."
              else
                echo "Round 2: not applied. $WHY2"
              fi
            fi
            echo
            echo "Each round's report is in the run's artifact. The fact-check above"
            echo "is the latest one, on the post as it is now on master."
          } > /tmp/autofix.md
          # A refused round leaves no fresh report: the one it tried to apply
          # still describes the post, so it is the one the gate reads.
          if [ ! -s /tmp/factcheck.md ]; then
            rounds=(/tmp/factcheck.round-*.md)
            cp "${rounds[-1]}" /tmp/factcheck.md
          fi

      - name: Render the slides
        run: python src/render.py "${{ inputs.post }}"

      # Measures the page render.py just screenshotted: frame containment,
      # overflow, contrast, the preprint flag, the colorway rhythm. Exits 1 on
      # BLOCK, which is a finding to carry into the message rather than a
      # reason to abandon the run.
      - name: Proof the rendered layout
        continue-on-error: true
        run: python src/proof.py "${{ inputs.post }}" | tee /tmp/proof.md

      # The reports exist in two places, and both are awkward to read later:
      # /tmp on a runner that is deleted when the job ends, and a phone. When
      # a post is held it is worth being able to see afterwards what the gate
      # word actually was, without re-running the check and spending the
      # quota again. `always()` because the run that most needs its reports
      # kept is the one where a later step failed — the first send to carry a
      # real fact-check died on Telegram's message cap and took the only copy
      # of the report with it.
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: reports-${{ steps.post.outputs.stem }}
          path: |
            /tmp/factcheck.md
            /tmp/factcheck.original.md
            /tmp/factcheck.round-*.md
            /tmp/autofix.md
            /tmp/proof.md
          retention-days: 14
          if-no-files-found: warn

      - name: Send to Telegram for approval
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # shellcheck disable=SC2046 # the note is one path or none
          python src/telegram.py send "${{ inputs.post }}" \
            --review /tmp/factcheck.md \
            --review /tmp/proof.md \
            $([ -s /tmp/autofix.md ] && echo --review /tmp/autofix.md)

      # A failed run is silent unless somebody opens the Actions tab. See
      # .github/actions/notify-failure for why that is the thing to fix.
      - name: Say so in Telegram if this run broke
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
